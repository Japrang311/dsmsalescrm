name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  BUN_VERSION: 1.3.14
  SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.CI_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  database:
    name: Local database gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase@2.109.1 start

      - name: Reset database and run advisors/lint
        run: bun run verify:db

  tests:
    name: Application and RLS tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase@2.109.1 start

      - name: Reset database
        run: bunx supabase@2.109.1 db reset --local

      - name: Run tests
        run: bun run test:ci

  browser_e2e:
    name: Browser E2E flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase@2.109.1 start

      - name: Reset database
        run: bunx supabase@2.109.1 db reset --local

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: artifacts/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: artifacts/playwright-results
          if-no-files-found: ignore

  runtime_bundle:
    name: Runtime smoke and bundle report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Bundle report
        run: bun run bundle:report

      - name: Runtime smoke
        run: bun run smoke:runtime

      - name: Upload bundle report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-report
          path: artifacts/bundle-report.json
          if-no-files-found: ignore

  migration_parity:
    name: Production migration parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Pull requests only report drift: a PR is allowed to add a migration
      # that production has not been given yet. Pushes to main are what Vercel
      # deploys, so there the check must fail.
      - name: Check migration parity (pull request, warn only)
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bun scripts/check-migration-parity.ts --warn-only

      - name: Check migration parity (main)
        if: github.event_name == 'push'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bun scripts/check-migration-parity.ts

  performance_budget:
    name: Stage 3 performance budgets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase
        run: bunx supabase@2.109.1 start

      - name: Reset database
        run: bunx supabase@2.109.1 db reset --local

      - name: Load synthetic performance fixture
        run: bun run stage3:fixture

      - name: Check performance budgets
        run: bun run stage3:check-budgets

  dependency_risk:
    name: Dependency risk gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate dependency risk gate report
        run: bun run audit:deps:report

      - name: Upload dependency risk gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-risk-report
          path: artifacts/dependency-risk-report.md
          if-no-files-found: error
